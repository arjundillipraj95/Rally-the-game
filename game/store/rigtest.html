<!doctype html>
<html><head><meta charset="utf-8"><title>Captain rig test</title>
<style>html,body{margin:0;background:#d8d8d8;font-family:system-ui,sans-serif}#lab{position:absolute;top:6px;left:0;right:0;display:flex}#lab div{flex:1;text-align:center;font-weight:700;color:#333}</style></head>
<body><canvas id="c"></canvas><div id="lab"></div>
<script type="module">
// Dev test: rig the generated captain (a skeleton and skin weights worked out from his shape), then
// pose him to check how he bends. ?pose=a,b,c,d picks the poses; ?view=front|side|three
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { rigCaptain, POSES, applyPose, addArmour } from './captainrig.js';
const q = new URLSearchParams(location.search), poses = (q.get('pose') || 'tpose,rest,windup,strike').split(','), view = q.get('view') || 'three';
const W = 1600, H = 620, r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
r.setPixelRatio(1); r.setSize(W, H); r.setClearColor(0xd8d8d8); r.setScissorTest(true);
const scene = new THREE.Scene(); scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 1.1)); const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(2, 3, 4); scene.add(sun); const back = new THREE.DirectionalLight(0xffffff, .7); back.position.set(-2, 2, -4); scene.add(back);
const g = await new GLTFLoader().loadAsync(q.get('f') || 'models/captain.glb');
let src = null; g.scene.traverse(o => { if (o.isMesh && !src) src = o; });
if (src.material && src.material.map) { src.material.metalness = 0; src.material.roughness = .8; src.geometry.userData.material = src.material; }
let arm = null; if (q.get('armour')) { const ga = await new GLTFLoader().loadAsync(q.get('armour')); ga.scene.traverse(o => { if (o.isMesh && !arm) arm = o; }); arm.material.metalness = .35; arm.material.roughness = .45; }
const n = poses.length, rigs = poses.map(() => { const R = rigCaptain(src.geometry, { gear: q.get('gear') !== '0', show: q.get('bones') === '1', body: q.get('body') || 'captain', weapon: q.get('weapon') || 'sword' }); if (arm) addArmour(R, arm.geometry, arm.material); return R; });
rigs.forEach((R, i) => { R.root.visible = false; scene.add(R.root); });
const ang = { front: 0, side: Math.PI / 2, three: -Math.PI / 4.5, back: Math.PI }[view];
poses.forEach((p, i) => {
  rigs.forEach((R, k) => R.root.visible = k === i);
  applyPose(rigs[i], POSES[p] || POSES.tpose); rigs[i].root.updateMatrixWorld(true);
  const Z = +(q.get('zoom') || 1), CY = +(q.get('cy') || .02), R = 1.25 / Z, a2 = q.get('angs') ? +q.get('angs').split(',')[i] * Math.PI / 180 : ang, cam = new THREE.OrthographicCamera(-R, R, R * H / (W / n), -R * H / (W / n), .01, 100);
  cam.position.set(Math.sin(a2) * 6, CY + .58, Math.cos(a2) * 6); cam.lookAt(0, CY, 0);
  r.setViewport(i * W / n, 0, W / n, H); r.setScissor(i * W / n, 0, W / n, H); r.render(scene, cam);
  const d = document.createElement('div'); d.textContent = p; document.getElementById('lab').appendChild(d);
});
window.__done = true;
</script></body></html>
