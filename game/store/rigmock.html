<!doctype html>
<html><head><meta charset="utf-8"><title>Rig mock</title>
<style>
  html,body{margin:0;background:#cfe0b8;font-family:"Barlow Semi Condensed",system-ui,sans-serif;}
  #wrap{position:relative;width:1400px;height:820px;}
  canvas{display:block;}
  .lab{position:absolute;color:#2a2622;font-weight:800;font-size:22px;text-align:center;width:300px;}
  .row{position:absolute;left:18px;color:#2a2622;font-weight:800;font-size:26px;writing-mode:vertical-rl;transform:rotate(180deg);}
  .note{position:absolute;left:70px;right:20px;bottom:12px;font-size:17px;color:#3b362f;}
  h1{position:absolute;left:70px;top:6px;margin:0;font-size:28px;color:#2a2622;}
</style></head>
<body><div id="wrap"><canvas id="c"></canvas>
<h1>Captain body: today vs proposed (sketch, same proportions as the game)</h1>
<div class="row" id="r1">TODAY</div>
<div class="row" id="r2">PROPOSED</div>
<div class="note">Proposed: elbow joint, arms ~18% longer, a wrist the blade turns in, blade and shield ~20% bigger. Head, helmet, body and armour unchanged.</div>
</div>
<script type="module">
import * as THREE from 'three';
const W = 1400, H = 820;
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
r.setPixelRatio(window.devicePixelRatio || 1); r.setSize(W, H); r.setClearColor(0xcfe0b8);
const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(-12.8, 12.8, 7.5, -7.5, .1, 100);
cam.position.set(1.5, 3.2, 14); cam.lookAt(0, -1.6, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x88806a, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(5, 9, 8); scene.add(sun);
const M = c => new THREE.MeshLambertMaterial({ color: c });
const BLUE = M(0x3b6fd8), DARK = M(0x2a4a90), SKIN = M(0xf0c8a0), STEEL = new THREE.MeshPhongMaterial({ color: 0xc9d2dc, shininess: 60 }), LEATHER = M(0x6b4a2e), GOLD = M(0xffd23a), BLADE = new THREE.MeshPhongMaterial({ color: 0xeef2f5, shininess: 90 }), SH = M(0x2f62c8);
const cap = (r0, len) => new THREE.CapsuleGeometry(r0, len, 4, 10);
const mesh = (g, m, x = 0, y = 0, z = 0) => { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); return o; };

// a captain; v: 'today' or 'new'; pose: {sx, sz, el, wr, twist, lean, step, shield}
function captain(v, P) {
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const nu = v === 'new', k = nu ? 1.18 : 1, wk = nu ? 1.2 : 1;
  // legs
  for (const [x, a] of [[-.2, P.step || 0], [.2, -(P.step || 0) * .5]]) { const l = new THREE.Group(); l.position.set(x, .78, 0); l.rotation.x = a; l.add(mesh(cap(.15, .44), DARK, 0, -.35, 0)); l.add(mesh(new THREE.SphereGeometry(.14, 10, 8), LEATHER, 0, -.68, .06)); root.add(l); }
  body.rotation.y = P.twist || 0; body.rotation.x = P.lean || 0;
  const torso = mesh(new THREE.SphereGeometry(.46, 18, 14), STEEL, 0, 1.1, 0); torso.scale.set(1, 1.0, .9); body.add(torso);
  body.add(mesh(new THREE.CylinderGeometry(.5, .54, .3, 18), BLUE, 0, .66, 0));
  body.add(mesh(new THREE.SphereGeometry(.4, 18, 14), SKIN, 0, 1.78, 0));
  const helm = mesh(new THREE.SphereGeometry(.44, 18, 10, 0, Math.PI * 2, 0, Math.PI / 2), STEEL, 0, 1.86, 0); body.add(helm);
  const crest = mesh(new THREE.SphereGeometry(1, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), GOLD, 0, 2.25, 0); crest.scale.set(.33, .32, .08); crest.rotation.y = Math.PI / 2; body.add(crest);
  for (const x of [-.12, .12]) body.add(mesh(new THREE.SphereGeometry(.05, 8, 6), M(0x222222), x, 1.78, .38));
  // shield arm (left of the figure)
  const sA = new THREE.Group(); sA.position.set(-.5, 1.3, .05); sA.rotation.x = P.shield ?? -.5; body.add(sA);
  sA.add(mesh(cap(.12, .34 * k), SKIN, 0, -.22 * k, 0));
  const sh = mesh(new THREE.BoxGeometry(.75 * wk, 1.0 * wk, .1), SH, -.08, -.45 * k, .28); sA.add(sh);
  sh.add(mesh(new THREE.SphereGeometry(.1, 10, 8), GOLD, 0, 0, .07));
  // weapon arm (right of the figure)
  const wA = new THREE.Group(); wA.position.set(.5, 1.3, .05); wA.rotation.set(P.sx || 0, 0, P.sz || 0); body.add(wA);
  let hand;
  if (!nu) { // today: one piece, a ball for a hand, the blade fixed to the arm
    wA.add(mesh(cap(.12, .34), SKIN, 0, -.22, 0));
    hand = new THREE.Group(); hand.position.set(0, -.5, .02); wA.add(hand);
    hand.add(mesh(new THREE.SphereGeometry(.12, 10, 8), SKIN));
  } else { // proposed: upper arm, an elbow, forearm, and a wrist the blade turns in
    wA.add(mesh(cap(.12, .2), SKIN, 0, -.18, 0));
    wA.add(mesh(new THREE.SphereGeometry(.11, 10, 8), STEEL, 0, -.36, 0)); // (elbow guard: shows the joint)
    const fore = new THREE.Group(); fore.position.set(0, -.36, 0); fore.rotation.x = P.el || 0; wA.add(fore);
    fore.add(mesh(cap(.11, .18), SKIN, 0, -.17, 0));
    fore.add(mesh(new THREE.CylinderGeometry(.13, .12, .14, 10), LEATHER, 0, -.26, 0)); // (bracer)
    hand = new THREE.Group(); hand.position.set(0, -.36, .02); hand.rotation.x = P.wr || 0; fore.add(hand);
    hand.add(mesh(new THREE.SphereGeometry(.12, 10, 8), SKIN));
  }
  // the sword: grip, guard, blade (pointing forward from the fist, along +z)
  const sw = new THREE.Group(); hand.add(sw);
  sw.add(mesh(new THREE.BoxGeometry(.06, .06, .22), LEATHER, 0, 0, 0));
  sw.add(mesh(new THREE.BoxGeometry(.34 * wk, .07, .07), GOLD, 0, 0, .14));
  sw.add(mesh(new THREE.BoxGeometry(.09 * wk, .05, .78 * wk), BLADE, 0, 0, .14 + .4 * wk));
  return root;
}
// four poses: rest, wind-up, slash/thrust, overhead
const POSES = {
  today: [
    { sx: -.35 },
    { sx: -2.3, sz: .9, twist: -.45 },
    { sx: -1.5, twist: .3, lean: .2, step: -.5 },
    { sx: -3.1, lean: -.1 },
  ],
  new: [
    { sx: -.3, el: -1.4, wr: 0 }, // (elbow bent, blade up and ready)
    { sx: -.7, sz: 1.3, el: -1.8, wr: .6, twist: -.5 }, // (cocked back over the shoulder)
    { sx: -1.5, el: 0, wr: 1.5, twist: .3, lean: .25, step: -.6 }, // (arm straight out, the blade along it: a real thrust)
    { sx: -2.9, el: -1.3, wr: .3, lean: -.15 }, // (forearm folded behind the head, blade hanging down the back: the chop to come)
  ],
};
const COLS = [-7.5, -2.5, 2.5, 7.5];
[['today', 1.0], ['new', -5.0]].forEach(([v, y]) => POSES[v].forEach((P, i) => {
  const c = captain(v, P); c.position.set(COLS[i], y, 0); c.rotation.y = -1.2; c.scale.setScalar(1.15); /* (side-on, facing left: the weapon arm toward you) */ scene.add(c);
  const g = mesh(new THREE.CylinderGeometry(1.0, 1.0, .06, 28), M(0xb6cc98), COLS[i], y - .05, 0); scene.add(g);
}));
r.render(scene, cam);
const labs = ['Ready', 'Wind-up', 'Thrust', 'Overhead chop'];
COLS.forEach((x, i) => { const v = new THREE.Vector3(x, 0, 0).project(cam); const d = document.createElement('div'); d.className = 'lab'; d.textContent = labs[i]; d.style.left = ((v.x + 1) / 2 * W - 150) + 'px'; d.style.top = '52px'; document.getElementById('wrap').appendChild(d); });
for (const [id, y] of [['r1', 1.0], ['r2', -5.0]]) { const v = new THREE.Vector3(-11, y + 1.3, 0).project(cam), el = document.getElementById(id); el.style.top = ((1 - v.y) / 2 * H - 80) + 'px'; }
window.__done = true;
</script></body></html>
