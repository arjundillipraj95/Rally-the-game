# Builds game/ and deploys it to GitHub Pages on every push to main.
# Needs Settings > Pages > Source = "GitHub Actions". Until Arjun switches it, the site still serves the
# built files committed at the repo root, and this workflow's deploy step has no effect on the live site.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: game/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Build
        working-directory: game
        run: npm ci && npm run build
      - name: Use the online service address the deploy bot committed (online.json at the repo root)
        run: '[ -f online.json ] && cp online.json game/dist/online.json || true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist
      - id: deployment
        uses: actions/deploy-pages@v4
