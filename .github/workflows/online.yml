# Deploys the online service (online/) to Cloudflare, then publishes its address in online.json at the
# site root, which the game reads when it loads. Needs the repository secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID; without them it does nothing (the game stays offline-only).
name: Deploy online service
on:
  push:
    branches: [main]
    paths: ['online/**', '.github/workflows/online.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: online-deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets present?
        id: chk
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::warning::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets to deploy the online service."; fi
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.ok == 'true'
        with: { node-version: 20 }
      - name: Deploy the worker
        if: steps.chk.outputs.ok == 'true'
        id: dep
        working-directory: online
        run: |
          set -eo pipefail
          npm ci
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Hand the voice relay (Metered.ca) secrets to the worker, if set
        if: steps.chk.outputs.ok == 'true'
        working-directory: online
        env:
          METERED_APP: ${{ secrets.METERED_APP }}
          METERED_SECRET_KEY: ${{ secrets.METERED_SECRET_KEY }}
        run: |
          if [ -n "$METERED_APP" ] && [ -n "$METERED_SECRET_KEY" ]; then
            node -e 'require("fs").writeFileSync("/tmp/rally-sec.json", JSON.stringify({METERED_APP: process.env.METERED_APP, METERED_SECRET_KEY: process.env.METERED_SECRET_KEY}))'
            npx wrangler secret bulk /tmp/rally-sec.json > /dev/null; rm -f /tmp/rally-sec.json
            echo "Metered relay secrets set"
          else
            echo "::notice::METERED_APP / METERED_SECRET_KEY not set: voice and the game link use the public relays only."
          fi
      - name: Publish its address for the game
        if: steps.dep.outputs.url != ''
        run: |
          echo "{\"url\":\"${{ steps.dep.outputs.url }}\",\"at\":\"$(date -u +%FT%TZ)\"}" > online.json
          echo "{\"url\":\"${{ steps.dep.outputs.url }}\"}" > game/public/online.json || true
          git config user.name "rally-deploy"; git config user.email "actions@users.noreply.github.com"
          git add online.json game/public/online.json 2>/dev/null || git add online.json
          git diff --cached --quiet || (git commit -m "Online service deployed: ${{ steps.dep.outputs.url }}" && git push)
